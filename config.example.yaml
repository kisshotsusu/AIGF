app:
  room_id: 0                    # B站直播间号，必须修改
  dry_run: true                 # 首次运行保持 true；确认无误再改 false
  send_danmaku: false           # false=只生成/播放语音，永远不发送回复弹幕
  log_level: INFO

bilibili:
  cookie_env: BILIBILI_COOKIE   # 不要把 Cookie 直接写进配置文件
  welcome_enabled: true
  welcome_template: "欢迎 {username} 来到直播间！"
  welcome_cooldown_seconds: 1800
  send_interval_seconds: 6
  max_message_length: 20        # B站普通弹幕常见限制，超长回复自动截断

reply:
  enabled: true
  trigger_mode: mention         # mention | all | prefix
  bot_names: ["小助手", "主播"]
  prefixes: ["!ai", "问一下"]
  ignore_users: []
  ignore_masked_usernames: true
  cooldown_seconds: 2
  max_context_messages: 12
  max_memory_items: 8

gift_reply:
  enabled: true
  cooldown_seconds: 8
  min_total_coin: 0
  template: "谢谢{username}送出的{gift_name}×{num}！"

llm:
  provider: deepseek            # deepseek | mimo | custom
  timeout_seconds: 45
  temperature: 0.8
  max_tokens: 120
  providers:
    deepseek:
      base_url: "https://api.deepseek.com"
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-chat
    mimo:
      base_url: "https://api.xiaomimimo.com/v1"
      api_key_env: MIMO_API_KEY
      model: mimo-v2.5
      auth_header: api-key
      max_tokens_field: max_completion_tokens
      supports_images: true
      extra_body:
        thinking:
          type: disabled
    custom:
      base_url: "http://127.0.0.1:8000/v1"
      api_key_env: CUSTOM_API_KEY
      model: local-model

tts:
  enabled: true
  url: "http://127.0.0.1:9879/api/tts"
  health_url: "http://127.0.0.1:9879/api/options"
  auto_start: true
  start_command: "E:\\Doc\\SVC\\启动推理.bat"
  startup_timeout_seconds: 240
  svc_auto_options: true         # 自动从 /api/options 选择最新模型和参考音频
  model: ""                     # 留空自动选；也可填写训练轮次，例如 50
  reference: ""                 # 留空自动选；也可填写参考 wav 的完整路径
  method: POST
  timeout_seconds: 60
  # 可用占位符：{text}、{speaker}。默认按 JSON 发送。
  request_json:
    text: "{text}"
    speed: 1.0
    top_k: 5
    top_p: 1.0
    temperature: 1.0
  speaker: default               # 供其他兼容语音服务使用
  # audio: 响应体就是音频；json_base64: JSON 字段里是 base64；json_url: JSON 字段里是音频URL
  response_type: audio
  response_field: audio
  play_audio: true

memory_write:
  mode: important                # off | all | important
  importance_threshold: 70       # 0-100，仅达到阈值才写入
  analyze_with_llm: true         # 用当前模型判断重要度并生成摘要
  min_message_length: 4
  max_daily_writes: 20
  always_keywords: ["记住", "我叫", "我的名字", "我喜欢", "我讨厌", "以后叫我"]
  ignore_keywords: ["测试", "111", "哈哈"]

image_generation:
  preset: custom
  provider: custom
  mode: images                  # images | chat_multimodal
  base_url: https://api.example.com/v1
  api_key_env: IMAGE_API_KEY
  model: your-image-model
  size: 1024x1024
  timeout_seconds: 180

# MiMo provides multimodal understanding through chat/completions. It does not
# replace the image generation/editing service configured above.
image_understanding:
  provider: mimo
  base_url: https://api.xiaomimimo.com/v1
  api_key_env: MIMO_API_KEY
  model: mimo-v2.5
  auth_header: api-key
  max_tokens_field: max_completion_tokens
  max_completion_tokens: 1024
  timeout_seconds: 60
  extra_body:
    thinking:
      type: disabled

mimo_multimodal:
  enabled: true
  base_url: "https://api.xiaomimimo.com/v1"
  api_key_env: MIMO_API_KEY
  image_enabled: true
  image_model: mimo-v2.5
  speech_enabled: true
  speech_model: mimo-v2.5-asr
  speech_language: auto
  completion_check_enabled: true
  completion_model: mimo-v2.5
  completion_max_retries: 2
  timeout_seconds: 60
  max_completion_tokens: 1024
  fail_closed: true
  # DeepSeek 图像识别：DeepSeek 官方 API 为纯文本模型，采用“视觉代理”方案。
  # 未显式配置代理时复用上方 MiMo 图片模型；也可换成任意支持 image_url 的模型。
  deepseek_image_enabled: true
  deepseek_image_model: deepseek-chat
  deepseek_image_base_url: https://api.deepseek.com
  deepseek_image_api_key_env: DEEPSEEK_API_KEY
  deepseek_image_proxy_enabled: true
  deepseek_image_proxy_base_url: https://api.xiaomimimo.com/v1
  deepseek_image_proxy_api_key_env: MIMO_API_KEY
  deepseek_image_proxy_model: mimo-v2.5
  deepseek_image_proxy_auth_header: api-key
  deepseek_image_proxy_max_tokens_field: max_completion_tokens
  deepseek_image_proxy_extra_body:
    thinking:
      type: disabled

# 本地 ComfyUI 图像/视频生成（Comfy Desktop 独立版）
comfyui:
  enabled: true
  base_url: http://127.0.0.1:8188
  auto_start: true
  install_dir: D:\Comfy-Desktop\ComfyUI-Installs\ComfyUI
  python: D:\Comfy-Desktop\ComfyUI-Installs\ComfyUI\ComfyUI\.venv\Scripts\python.exe
  extra_model_paths_config: C:\Users\21018\AppData\Roaming\Comfy Desktop\shared_model_paths.yaml
  input_dir: D:\Comfy-Desktop\ComfyUI-Shared\input
  output_dir: D:\Comfy-Desktop\ComfyUI-Shared\output
  home_output_dir: outputs/comfyui
  startup_timeout_seconds: 180
  timeout_seconds: 900
  poll_interval_seconds: 2

# CosyVoice2 情绪指令 TTS（本地 FastAPI，端口 50000）
cosyvoice:
  enabled: true
  base_url: http://127.0.0.1:50000
  auto_start: true
  install_dir: E:\OtherProgram\CosyVoice
  python: E:\OtherProgram\CosyVoice\.venv\Scripts\python.exe
  model_dir: E:\OtherProgram\CosyVoice\pretrained_models\CosyVoice2-0.5B
  server_port: 50000
  reference_dir: outputs/cosyvoice_refs
  output_dir: outputs/cosyvoice
  startup_timeout_seconds: 240
  timeout_seconds: 180
  sample_rate: 24000

workspace:
  path: workspace
  identity_file: IDENTITY.yaml
  soul_file: SOUL.md
  rules_file: RULES.md
  abilities_file: ABILITIES.md
  memory_dir: memory
  character_image_dir: character_images
  character_profile_file: CHARACTER.md
  daily_memory: true

# Vision GUI MCP 服务（GUI-Owl / GUI-Actor 视觉控制后端）
# HomeAgent 按此段自动拉起 Vision/mcp_server.py 并注册 ui_* 视觉工具。
# GUI-Owl 模型已就绪（Vision/models/GUI-Owl-1.5-2B-Instruct），默认 backend=gui_owl。
vision_mcp:
  enabled: true                       # 启用 Vision MCP 服务与 ui_* 工具
  auto_start: true                    # HomeAgent 启动时自动拉起 Vision MCP
  backend: gui_owl                    # 识别后端: gui_owl (Qwen3-VL) | gui_actor (Qwen2-VL)
  gui_enabled: true                   # 允许代理下发 GUI 点击/输入等视觉操作指令
  url: http://127.0.0.1:8765/mcp
  host: 127.0.0.1
  port: 8765
  preload_model: true                # 服务启动即加载模型，避免首次调用卡顿
  startup_timeout_seconds: 120
  task_timeout_seconds: 180
  # gui_owl_model / gui_actor_model 留空时由代码按 ROOT/Vision/models/... 解析
  existing_browser_cdp_endpoints:
  - http://127.0.0.1:9222
  - http://127.0.0.1:9223
  - http://127.0.0.1:9333
